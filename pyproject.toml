[project]
name = "bandcamp-download"
version = "0.1.0"
description = "Download selected purchased albums from your Bandcamp collection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brandon" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bcdl = "bcdl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
